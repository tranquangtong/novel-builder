name: Kiểm tra và triển khai

# Mỗi lần push: lint, typecheck, unit test, build, E2E (bản tĩnh và bản Cloudflare Worker).
# Chỉ nhánh mặc định mới được triển khai:
#   - GitHub Pages: bản tĩnh (GitHub/demo); khi đã có Cloudflare thì chỉ là trang chuyển hướng sang Cloudflare
#   - Cloudflare Worker (R2 + D1 + Access) — chỉ chạy khi đã đặt biến CF_D1_DATABASE_ID
#     và secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (xem docs/CLOUDFLARE_SETUP.md)
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium

      # Bản tĩnh cho GitHub Pages: https://<user>.github.io/<tên-repo>/
      - name: Build (GitHub Pages)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_MANUSCRIPT_REPO: ${{ vars.MANUSCRIPT_REPO || 'tranquangtong/novel-thelastmiracle-manuscript' }}
      - name: E2E (bản tĩnh, chế độ demo + GitHub API giả)
        run: npx playwright test
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # Khi bản Cloudflare đã được cấu hình, github.io chỉ còn chuyển hướng sang đó
      # (tránh viết nhầm vào bản GitHub cũ). Chưa cấu hình thì vẫn triển khai bản tĩnh đầy đủ.
      - name: Trang chuyển hướng sang Cloudflare
        if: github.ref_name == github.event.repository.default_branch && vars.CF_D1_DATABASE_ID != ''
        run: node scripts/pages-redirect.mjs pages-redirect "${{ vars.CLOUDFLARE_URL || 'https://novel-builder.tongquangtran.workers.dev' }}" "/${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v5
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: ${{ vars.CF_D1_DATABASE_ID != '' && 'pages-redirect' || 'out' }}

      # Bản cho Cloudflare Worker: trang nằm ở gốc domain
      - name: Build (Cloudflare)
        run: rm -rf out && npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_TARGET: cloudflare
          # Đăng nhập Google qua Firebase (cấu hình web của Firebase không phải bí mật)
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          NEXT_PUBLIC_MANUSCRIPT_REPO: ${{ vars.MANUSCRIPT_REPO || 'tranquangtong/novel-thelastmiracle-manuscript' }}
      - name: E2E (Worker trên workerd + R2/D1 local)
        run: npx playwright test -c playwright.cloud.config.ts
      - uses: actions/upload-artifact@v7
        if: github.ref_name == github.event.repository.default_branch
        with:
          name: cloudflare-out
          path: out
          retention-days: 3

  deploy-pages:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    needs: build
    if: github.ref_name == github.event.repository.default_branch && vars.CF_D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: cloudflare-out
          path: out
      - name: Điền ID của D1
        run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ vars.CF_D1_DATABASE_ID }}/" wrangler.jsonc
      - name: Áp dụng migration D1
        run: npx wrangler d1 migrations apply novel-builder --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: >
          npx wrangler deploy
          --var "ACCESS_TEAM_DOMAIN:${{ vars.ACCESS_TEAM_DOMAIN }}"
          --var "ACCESS_AUD:${{ vars.ACCESS_AUD }}"
          --var "EDITOR_EMAILS:${{ vars.EDITOR_EMAILS }}"
          --var "AGENT_CLIENT_IDS:${{ vars.AGENT_CLIENT_IDS }}"
          --var "FIREBASE_PROJECT_ID:${{ vars.FIREBASE_PROJECT_ID }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Token cho agent (thay service token của Access): secret NB_AGENT_TOKENS = "tên:nbagent_…"
      - name: Cập nhật token agent
        run: |
          if [ -n "$AGENT_TOKENS" ]; then printf %s "$AGENT_TOKENS" | npx wrangler secret put AGENT_TOKENS; else echo "Chưa đặt secret NB_AGENT_TOKENS — bỏ qua"; fi
        env:
          AGENT_TOKENS: ${{ secrets.NB_AGENT_TOKENS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
