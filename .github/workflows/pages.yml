name: Kiểm tra và triển khai GitHub Pages

# Mỗi lần push: lint, typecheck, unit test, build tĩnh, E2E.
# Chỉ nhánh mặc định của repo mới được triển khai lên GitHub Pages.
# Bản build KHÔNG chứa bản thảo: trang tải nội dung từ repo private bằng token của tác giả lúc dùng.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # https://<user>.github.io/<tên-repo>/
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # Repo bản thảo gợi ý sẵn trên trang Kết nối (đặt ở Settings → Secrets and variables → Actions → Variables)
      NEXT_PUBLIC_MANUSCRIPT_REPO: ${{ vars.MANUSCRIPT_REPO }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E (Playwright, phục vụ out/ giống GitHub Pages)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-pages-artifact@v5
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: out

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
